services:
  - type: web
    name: ai-thong-minh-hon-hoc-sinh-lop-5
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ADMIN_PASSWORD
        sync: false # nhập mật khẩu admin trên Render dashboard
